name: Julkaise Firebaseen

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-julkaisu
  cancel-in-progress: true

jobs:
  julkaise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KALAKOMPPIS }}
          projectId: kalakomppis
          channelId: live
