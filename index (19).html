i. Se on hauskaa.','Olen ollut vedessä koko ikäni, enkä vieläkään ymmärrä kalastajia.','Kalastus opettaa nöyryyttä. Ja solmujen avaamista.','Paras kalapaikka on se, jota et kerro kenellekään. Minä tiedän sen. En kerro.','Hetki vielä. Kalat pitävät aina pienen dramaattisen tauon.','Jokainen kalastaja tarvitsee kaksi asiaa: toivoa ja varasiiman.','Älä kerro kalalle, että se on vain saalis. Se on herkkä asia.','Pilvinen päivä? Kalat eivät käytä aurinkolaseja.','Kalastus on ainoa laji, jossa istuminen lasketaan treeniksi.','Saalis tai ei, ainakin ötökät saivat lounasta.','Kala katsoo vieheitä kuin sinä katsot buffetpöytää. Ole herkullinen.','Tänään saat ainakin yhden asian: tarinan. Kala on bonus.','Ruoho on vihreämpää toisella puolella. Kalat myös. Kokeile vastarantaa.','Kärsivällisyys palkitaan. Joskus vasta seuraavalla reissulla.','Hyvää kalareissua! Minä jään tähän kommentoimaan.'];

const SPOTI='<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M7 17L17 7" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.2 2.4" stroke-linecap="round"/><circle cx="6" cy="18" r="4" fill="#E4791C" stroke="#fff" stroke-width="1.5"/><circle cx="18" cy="6" r="3.2" fill="#3E7CA6" stroke="#fff" stroke-width="1.5"/></svg>';

om.','Remember: the fish doesn’t know you’re in a hurry.'],'Tänään tuulee juuri sopivasti. Sanoisin näin myrskylläkin.':['Det blåser precis lagom i dag. Det skulle jag säga i storm också.','The wind is just right today. I’d say that in a storm too.'],'Jos kala ei tule sinun luoksesi, mene sinä kalan luo. Mutta älä ui.':['Om fisken inte kommer till dig, gå till fisken. Men simma inte.','If the fish won’t come to you, go to the fish. But don’t swim.'],'Hiljaisuus rannalla on parasta musiikkia. Paitsi kelan surina.':['Tystnaden vid stranden är den bästa musiken. Utom rullens surr.','Silence on the shore is the best music. Except the whirr of the reel.'],'Olen nähnyt tuon vieheen ennenkin. Se oli hieno silloinkin.':['Jag har sett det betet förut. Det var fint då också.','I’ve seen that lure before. It looked great then too.'],'Kalaonni on kuin sää: kukaan ei osaa ennustaa, mutta kaikki yrittävät.':['Fiskelycka är som vädret: ingen kan förutsäga den, men alla försöker.','Fishing luck is like the weather: no one can predict it, but everyone tries.'],'Älä laske heittoja. Laske hymyjä. Niitäkin tulee vähemmän kuin luulet.':['Räkna inte kasten. Räkna leendena. De blir också färre än du tror.','Don’t count casts. Count smiles. There’ll be fewer than you think too.'],'Kuulostaa hullulta, mutta kala on usein siellä, missä vesi on.':['Det låter galet, men fisken finns ofta där vattnet är.','Sounds crazy, but the fish is often where the water is.'],'Pieni kala on iso kala, joka ei ole vielä kasvanut tarinaksi.':['En liten fisk är en stor fisk som inte vuxit till en historia än.','A small fish is a big fish that hasn’t grown into a story yet.'],'Termospullo täynnä? Hyvä. Puolet onnistumisesta on jo taskussa.':['Termosen full? Bra. Halva framgången är redan i fickan.','Thermos full? Good. Half the success is already in your pocket.'],'Pidä siima kireällä ja mieli löysänä.':['Håll linan sträckt och sinnet avslappnat.','Keep the line tight and the mind loose.'],'Se iso, joka karkasi viime kerralla, kysyi sinua. Valehtelin, ettet tule.':['Den stora som slank iväg förra gången frågade efter dig. Jag ljög att du inte kommer.','The big one that got away last time asked about you. I lied and said you weren’t coming.'],'Jos epäilet, vaihda väriä. Jos et epäile, vaihda silti. Se on hauskaa.':['Om du tvivlar, byt färg. Om du inte tvivlar, byt ändå. Det är roligt.','If in doubt, change colour. If not in doubt, change anyway. It’s fun.'],'Olen ollut vedessä koko ikäni, enkä vieläkään ymmärrä kalastajia.':['Jag har varit i vattnet hela livet och förstår fortfarande inte fiskare.','I’ve been in the water all my life and I still don’t understand anglers.'],'Kalastus opettaa nöyryyttä. Ja solmujen avaamista.':['Fiske lär ut ödmjukhet. Och att reda ut knutar.','Fishing teaches humility. And untangling knots.'],'Paras kalapaikka on se, jota et kerro kenellekään. Minä tiedän sen. En kerro.':['Det bästa fiskestället är det du inte berättar om. Jag vet var det är. Jag säger inget.','The best spot is the one you tell no one about. I know it. I’m not telling.'],'Hetki vielä. Kalat pitävät aina pienen dramaattisen tauon.':['Ett ögonblick till. Fiskarna tar alltid en liten dramatisk paus.','Just a moment more. Fish always take a little dramatic pause.'],'Jokainen kalastaja tarvitsee kaksi asiaa: toivoa ja varasiiman.':['Varje fiskare behöver två saker: hopp och extra lina.','Every angler needs two things: hope and spare line.'],'Älä kerro kalalle, että se on vain saalis. Se on herkkä asia.':['Säg inte till fisken att den bara är en fångst. Det är ett känsligt ämne.','Don’t tell the fish it’s just a catch. It’s a sensitive subject.'],'Pilvinen päivä? Kalat eivät käytä aurinkolaseja.':['Mulen dag? Fiskarna har inga solglasögon.','Cloudy day? Fish don’t wear sunglasses.'],'Kalastus on ainoa laji, jossa istuminen lasketaan treeniksi.':['Fiske är den enda sporten där sittande räknas som träning.','Fishing is the only sport where sitting counts as training.'],'Saalis tai ei, ainakin ötökät saivat lounasta.':['Fångst eller inte, åtminstone fick myggorna lunch.','Catch or no catch, at least the mosquitoes got lunch.'],'Kala katsoo vieheitä kuin sinä katsot buffetpöytää. Ole herkullinen.':['Fisken tittar på beten som du tittar på en buffé. Var aptitlig.','A fish looks at lures like you look at a buffet. Be delicious.'],'Tänään saat ainakin yhden asian: tarinan. Kala on bonus.':['I dag får du åtminstone en sak: en historia. Fisken är en bonus.','Today you’ll get at least one thing: a story. The fish is a bonus.'],'Ruoho on vihreämpää toisella puolella. Kalat myös. Kokeile vastarantaa.':['Gräset är grönare på andra sidan. Fiskarna också. Prova motsatta stranden.','The grass is greener on the other side. So are the fish. Try the far shore.'],'Kärsivällisyys palkitaan. Joskus vasta seuraavalla reissulla.':['Tålamod belönas. Ibland först nästa tur.','Patience is rewarded. Sometimes only on the next trip.'],'Hyvää kalareissua! Minä jään tähän kommentoimaan.':['Trevlig fisketur! Jag stannar här och kommenterar.','Have a good fishing trip! I’ll stay here and comment.'],'Kaikki kalat':['Alla fiskar','All fish'],'Näytä kaikki lajit':['Visa alla arter','Show all species'],'Ehdotukset tälle lajille':['Förslag för arten','Suggestions for this species'],'Ei vielä saaliita tästä lajista. Kun kirjaat niitä, ehdotukset ilmestyvät tähän.':['Inga fångster av arten ännu. När du loggar dem visas förslag här.','No catches of this species yet. Suggestions appear here once you log some.'],'Uloskirjautuessa tiedot tallennetaan ensin pilveen. Ne jäävät tähän laitteeseen piiloon, kunnes kirjaudut takaisin.':['Vid utloggning sparas uppgifterna först i molnet. De ligger kvar dolda på enheten tills du loggar in igen.','When you sign out, your data is saved to the cloud first. It stays hidden on this device until you sign in again.'],'Lainattu tai yhteinen laite':['Lånad eller delad enhet','Borrowed or shared device'],'Jos laite ei ole oma, voit kirjautua ulos niin, että tiedot poistetaan tästä laitteesta. Ne tallennetaan ensin pilveen ja latautuvat takaisin, kun kirjaudut sisään.':['Om enheten inte är din kan du logga ut så att uppgifterna raderas från enheten. De sparas först i molnet och laddas tillbaka när du loggar in.','If this isn’t your device, you can sign out and delete the data from it. It is saved to the cloud first and loads back when you sign in.'],'Ymmärrän, että tiedot poistetaan tästä laitteesta':['Jag förstår att uppgifterna raderas från enheten','I understand the data will be deleted from this device'],'Vahvista ensin rastittamalla, että tiedot poistetaan tästä laitteesta.':['Bekräfta först genom att kryssa i att uppgifterna raderas från enheten.','First confirm by ticking that the data will be deleted from this device.'],'Kirjaudu ulos ja poista tiedot tästä laitteesta':['Logga ut och radera uppgifterna från enheten','Sign out and delete data from this device'],'Käytä poistoa lainatussa tai yhteisessä laitteessa. Tiedot säilyvät pilvessä.':['Använd raderingen på en lånad eller delad enhet. Uppgifterna finns kvar i molnet.','Use deletion on a borrowed or shared device. Your data stays in the cloud.'],'Tietoja ei saatu tallennettua pilveen, joten niitä ei poistettu eikä sinua kirjattu ulos. Tarkista verkkoyhteys ja yritä uudelleen.':['Uppgifterna kunde inte sparas i molnet, så de raderades inte och du loggades inte ut. Kontrollera nätverket och försök igen.','Your data couldn’t be saved to the cloud, so nothing was deleted and you weren’t signed out. Check your connection and try again.'],'Kirjauduit ulos ja tiedot poistettiin tästä laitteesta. Ne ovat tallessa pilvessä.':['Du loggade ut och uppgifterna raderades från enheten. De finns kvar i molnet.','You signed out and your data was deleted from this device. It is safe in the cloud.'],'Kirjauduit ulos. Tietosi ovat piilossa, kunnes kirjaudut takaisin.':['Du loggade ut. Dina uppgifter är dolda tills du loggar in igen.','You signed out. Your data is hidden until you sign in again.'],'Kirjaudu sisään':['Logga in','Sign in'],'Tuli kala!':['Fick fisk!','Got a fish!'],'Montako kalaa?':['Hur många fiskar?','How many fish?'],'Peru':['Avbryt','Cancel'],'Valmis':['Klar','Done'],'Viehe':['Drag','Lure'],'Valitse viehe…':['Välj drag…','Choose lure…'],'Valitse viehe':['Välj drag','Choose lure'],'Uittotyyli':['Stil','Retrieve'],'Poista kala':['Ta bort fisk','Remove fish'],'Laji puuttuu':['Art saknas','Species missing'],'Viehe puuttuu':['Drag saknas','Lure missing'],'pidetty':['behållen','kept'],'Muut käytetyt vieheet':['Andra använda drag','Other lures used'],'Vieheet, joilla ei tullut kalaa. Aika jaetaan analyysissä tasan kaikkien käytettyjen vieheiden kesken.':['Drag som inte gav fisk. Tiden delas lika mellan alla använda drag i analysen.','Lures that caught nothing. Time is split evenly across all lures used in the analysis.'],'Ei muita vieheitä. Lisää niitä alla tai Vieheet-välilehdellä.':['Inga andra drag. Lägg till nedan eller under fliken Drag.','No other lures. Add them below or in the Lures tab.'],'Napauta vieheet, jotka jäivät pohjaan tai katkesivat.':['Tryck på drag som fastnade eller slets av.','Tap lures that snagged or broke off.'],'Valitse viehe jokaiselle kalalle':['Välj drag för varje fisk','Choose a lure for every fish'],'kala siirrettiin pääpaikkaan':['fisk flyttades till huvudplatsen','fish moved to the main place'],'kalaa siirrettiin pääpaikkaan':['fiskar flyttades till huvudplatsen','fish moved to the main place'],'Tasainen':['Jämn','Steady'],'Hidas':['Långsam','Slow'],'Nopea':['Snabb','Fast'],'Nykivä':['Ryckig','Twitching'],'Vertikaali':['Vertikal','Vertical'],'Raahaus':['Släp','Dragging'],'Pintauitto':['Ytfiske','Surface'],'Uistelu':['Trolling','Trolling'],'Tarkemmat kalapaikat':['Exakta fiskeplatser','Exact fishing spots'],'Pääpaikka':['Huvudplats','Main place'],'Kalapaikat':['Fiskeplatser','Fishing spots'],'Kalapaikka':['Fiskeplats','Fishing spot'],'kalapaikka':['fiskeplats','fishing spot'],'kalapaikkaa':['f 'Kalat ovat tänään ehdottomasti vedessä. Se on jo hyvä alku.':['Fiskarna är definitivt i vattnet idag. Det är en bra början.','The fish are definitely in the water today. That’s a good start.'],'Heitä vaan. Pahimmillaan saat raikasta ilmaa ja uuden tarinan.':['Kasta bara. I värsta fall får du frisk luft och en ny historia.','Just cast. At worst you get fresh air and a new story.'],'Kerran joku sai kalan. Voit olla seuraava!':['En gång fick någon en fisk. Du kan bli nästa!','Someone once caught a fish. You could be next!'],'Uskon sinuun. Kalat eivät vielä tiedä, mikä niitä odottaa.':['Jag tror på dig. Fiskarna vet inte än vad som väntar dem.','I believe in you. The fish don’t know what’s coming.'],'Jokainen heitto on edellistä parempi. Ei pidä paikkaansa, mutta hyvä fiilis.':['Varje kast är bättre än det förra. Stämmer inte, men känns bra.','Every cast is better than the last. Not true, but feels good.'],'Kala on pelkkä ajatus, kunnes se on siimassa. Ajattele kovemmin.':['En fisk är bara en tanke tills den sitter på linan. Tänk hårdare.','A fish is just an idea until it’s on the line. Think harder.'],'Olen ahven. Suhtaudun vieheisiisi täysin neutraalisti.':['Jag är en abborre. Jag är helt neutral till dina drag.','I’m a perch. I’m completely neutral about your lures.'],'Älä huoli, en ole nälkäinen. Mutta joku toinen voi olla.':['Oroa dig inte, jag är inte hungrig. Men någon annan kan vara det.','Don’t worry, I’m not hungry. But someone else might be.'],'Kuulin, että tänään on se päivä. Sanon sen joka päivä.':['Jag hörde att idag är dagen. Det säger jag varje dag.','I heard today’s the day. I say that every day.'],'Vesi odottaa. Minä myös, mutta pidän vähän taukoa.':['Vattnet väntar. Jag också, men jag tar en liten paus.','The water is waiting. Me too, but I’m taking a little break.'],
'Tyhjä reissu on vain kala, joka ei vielä tavannut sinua.':['En nolltrip är bara en fisk som inte har träffat dig än.','An empty trip is just a fish that hasn’t met you yet.'],'Kärsivällisyys on kalastajan taito. Minä en tosin lue.':['Tålamod är fiskarens dygd. Jag kan visserligen inte läsa.','Patience is the angler’s skill. I can’t read, though.'],'Valitse se violetti viehe. Tai älä. En oikeasti tiedä.':['Välj det lila draget. Eller inte. Jag vet faktiskt inte.','Pick the purple lure. Or don’t. I honestly don’t know.'],'Sinä heität, minä pohdin. Tasainen työnjako.':['Du kastar, jag funderar. Rättvis arbetsfördelning.','You cast, I ponder. Fair division of labour.'],'Tilastojen mukaan kalastaja kalastaa. Loput on yksityiskohtia.':['Enligt statistiken fiskar fiskaren. Resten är detaljer.','Statistically, anglers angle. The rest is details.'],'Olet jo voittanut: et ole toimistolla.':['Du har redan vunnit: du är inte på kontoret.','You’ve already won: you’re not at the office.'],'Jos ei nappaa, syytä tuulta. Se on siihen tehty.':['Om det inte nappar, skyll på vinden. Den finns till för det.','If nothing bites, blame the wind. That’s what it’s for.'],'Minulla on hyvä tunne tästä. Tunne ei perustu mihinkään.':['Jag har en bra känsla. Känslan bygger inte på något.','I have a good feeling about this. It’s based on nothing.'],'Älä katso kelloa. Kalat eivät katso sitäkään.':['Titta inte på klockan. Det gör inte fiskarna heller.','Don’t look at the clock. The fish don’t either.'],'Ihan pian vähän nykäisee. Tai sitten ei. Mutta pian.':['Snart nappar det lite. Eller inte. Men snart.','Any moment now there’ll be a tug. Or not. But soon.'],
'Toivon sinulle suuria kaloja. Minua ei kannata, olen mieluummin vedessä.':['Jag önskar dig stora fiskar. Inte mig, jag stannar hellre i vattnet.','I wish you big fish. Not me, I’d rather stay in the water.'],'Hyvä viehe, hyvä asenne ja hyvä kahvi. Kala on enää pieni lisä.':['Bra drag, bra attityd och bra kaffe. Fisken är bara en liten bonus.','Good lure, good attitude, good coffee. The fish is just a small bonus.'],'Kala ei karkaa. Paitsi aina.':['Fisken smiter inte. Utom alltid.','The fish won’t get away. Except always.'],'Kalareissu on 10 % kalaa ja 90 % kuvitelmaa. Kuvittele isosti.':['En fisketur är 10 % fisk och 90 % fantasi. Fantisera stort.','A fishing trip is 10% fish and 90% imagination. Imagine big.'],'Rauhoitu. Vesi on pysynyt paikallaan tuhansia vuosia.':['Lugn. Vattnet har legat still i tusentals år.','Relax. The water has stayed put for thousands of years.'],'Heiluttele vaappua uskottavasti. Teeskentele, että se on ruokaa.':['Vifta med wobblern trovärdigt. Låtsas att den är mat.','Wiggle the crankbait convincingly. Pretend it’s food.'],'Seuraava napakka nykäisy on varmasti kala. Ei risu, ei pohja. Kala.':['Nästa rejäla ryck är garanterat en fisk. Inte en kvist, inte botten. En fisk.','The next sharp tug is definitely a fish. Not a twig, not the bottom. A fish.'],'Älä luovuta! Olen puolellasi, vesilinjan toisella puolella.':['Ge inte upp! Jag är på din sida, fast på andra sidan vattenytan.','Don’t give up! I’m on your side, the other side of the waterline.'],'Pohjakiinnitys on vain kala, joka halasi vieheesi liian lujaa.':['Bottennapp är bara en fisk som kramade ditt drag för hårt.','A snag is just a fish that hugged your lure too hard.'],'Mene, heitä, nauti. Ja jos tulee kala, muista kehua minua.':['Gå, kasta, njut. Och om det blir fisk, kom ihåg att berömma mig.','Go, cast, enjoy. And if you catch one, remember to praise me.'],
'Olen kuullut huhuja suuresta kalasta. Lähde: minä, juuri nyt.':['Jag har hört rykten om en stor fisk. Källa: jag, just nu.','I’ve heard rumours of a big fish. Source: me, just now.'],'Älä murehdi tyhjää haavia. Se on vain tilaa tulevalle saaliille.':['Oroa dig inte för en tom håv. Det är bara plats för kommande fångst.','Don’t worry about an empty net. It’s just room for future catch.'],'Joka heitto on mahdollisuus. Useimmiten mahdollisuus vaan ei käytä sitä.':['Varje kast är en chans. Oftast tar chansen bara inte vara på den.','Every cast is a chance. Usually the chance just doesn’t take it.'],'Kalastus on 10 % taitoa, 20 % onnea ja 70 % kahvitaukoja.':['Fiske är 10 % skicklighet, 20 % tur och 70 % kaffepauser.','Fishing is 10% skill, 20% luck and 70% coffee breaks.'],'Jos vene keinuu, kala varmasti katsoo. Ehkä.':['Om båten gungar tittar fisken säkert. Kanske.','If the boat rocks, the fish is surely watching. Maybe.'],'Muista nostaa jalat ylös. Kalat tulevat, kun lopetat odottamisen.':['Kom ihåg att lägga upp fötterna. Fiskarna kommer när du slutar vänta.','Remember to put your feet up. The fish come when you stop waiting.'],'Sinä olet kalastajan mestari. Minä olen kalan puolueeton edustaja.':['Du är fiskets mästare. Jag är fiskens opartiska representant.','You’re the master angler. I’m the fish’s impartial representative.'],'Älä viitsi, olen ihan varma, että tällä viehe-värillä tärppää. Olen aina varma.':['Kom igen, jag är helt säker på att den här färgen nappar. Jag är alltid säker.','Come on, I’m totally sure this colour will get a bite. I’m always sure.'],'Joskus paras saalis on se muisto. Mutta kyllä kala silti olisi kiva.':['Ibland är minnet den bästa fångsten. Men en fisk vore ändå trevligt.','Sometimes the best catch is the memory. But a fish would still be nice.'],'Hyvä uutinen: et ole vielä saanut ruokaa myrkytettyä. Kalat ovat turvassa.':['Goda nyheter: du har inte förgiftat någon mat än. Fiskarna är trygga.','Good news: you haven’t poisoned any food yet. The fish are safe.'],
'Vedä rauhassa. Kala ei halua kiirehtiä.':['Dra lugnt. Fisken vill inte stressa.','Reel calmly. The fish doesn’t want to rush.'],'Heitä nyt vähän lähemmäs. Ei, kauemmas. Ei, ihan sama.':['Kasta lite närmare. Nej, längre bort. Nej, strunt samma.','Cast a bit closer. No, further. No, never mind.'],'Kalastaja ei hävitä, hän vain kerää tarinoita.':['En fiskare förlorar inte, hen samlar bara historier.','An angler doesn’t lose, they just collect stories.'],'Jos kuulet loiskahduksen, se on todennäköisesti minä. Älä välitä.':['Om du hör ett plask är det troligen jag. Bry dig inte.','If you hear a splash, it’s probably me. Never mind.'],'Tämä on tunnetusti ahvenen paras päivä. Tai oli eilen.':['Det här är känt som abborrens bästa dag. Eller var igår.','This is famously the perch’s best day. Or it was yesterday.'],'Sinulla on hyvä tekniikka. Vähän kuin kalatiskillä, mutta päinvastoin.':['Du har bra teknik. Lite som vid fiskdisken, fast tvärtom.','You have good technique. A bit like at the fish counter, but reversed.'],'Älä anna periksi. Koskaan. Paitsi jos tulee nälkä.':['Ge aldrig upp. Aldrig. Utom om du blir hungrig.','Never give up. Ever. Unless you get hungry.'],'Vaappu on viehe, ei sukulainen. Älä anna sen hämmentää.':['Wobblern är ett drag, inte en släkting. Låt den inte förvirra dig.','The crankbait is a lure, not a relative. Don’t let it confuse you.'],'Oikeaa väriä ei ole. On vain väri, jonka kala valitsee. Arvaa mikä.':['Det finns ingen rätt färg. Bara färgen fisken väljer. Gissa vilken.','There’s no right colour. Only the colour the fish picks. Guess which.'],'Jos tänään ei nappaa, huomenna nappaa. Tai ylihuomenna. Joskus.':['Nappar det inte idag så nappar det imorgon. Eller i övermorgon. Någon gång.','If they don’t bite today, they will tomorrow. Or the day after. Sometime.']};

  else if(a==='nww'){S.now.weather=S.now.weather===b.dataset.w?'':b.dataset.w;render()}

  else if(a==='savepin'){const v=cap(($('#pinname')||{}).value);if(!v)return toast('Anna paikalle nimi');if(!S.now.pos)return toast('Napauta ensin karttaa');S.geo[v]=S.now.pos;saveGeo();S.now.place=v;toast('Paikka tallennettu');render()}

  else if(a==='cpx'){S.cpk=null;render()}

  else if(a==='reset'){if(S.pend==='reset'){S.trips=[];S.lib=[];S.geo={};S.pend=null;save();saveGeo();toast('Sovellus tyhjennetty')}else S.pend='reset';render()}
